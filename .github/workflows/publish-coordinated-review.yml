name: Publish coordinated review PDFs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-coordinated-review.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: coordinated-review-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Verify and publish the three archived review PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 research/coordinated-revision/2026-11-26/assemble_release.py --repo . --publish
